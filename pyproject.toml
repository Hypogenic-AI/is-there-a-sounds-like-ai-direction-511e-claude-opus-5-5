[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "arxiv>=4.0.1",
    "datasets>=5.0.1",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.10.9",
    "openai>=3.24.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "tenacity>=9.1.4",
    "torch==2.8.0",
    "transformers>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
